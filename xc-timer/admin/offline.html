<head>

<!-- Shown by sw.js when an admin page other than Race Timing is opened with no signal. -->
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0d1420;--muted:#5a6575;--line:#d5dbe4;--pri:#0b3d91}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#161d28;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--pri:#8fb3ff}}
*{box-sizing:border-box}
html,body{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b3d91;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
header h1{margin:0;font-size:24px}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav a{color:#cfdcf5;text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px 10px 0 0;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 18px;text-align:center}
h2{font-size:24px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 20px}
.go{display:block;background:#0a7a3d;color:#fff;text-decoration:none;font-weight:800;font-size:20px;padding:16px;border-radius:14px;margin:0 auto 12px;max-width:420px}
button{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>2026 Riley Swanson Birthday Time Trial · Admin</h1>
  <nav><a href="./">Start List Creator</a><a href="timing.html">Race Timing</a><a href="finalize.html">Finalize Race</a></nav>
</header>
<main>
  <div class="card">
    <h2>No service</h2>
    <p>This page needs signal. Race Timing works without it, and your race data is safe on this device.</p>
    <a class="go" href="timing.html">Back to Race Timing</a>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
