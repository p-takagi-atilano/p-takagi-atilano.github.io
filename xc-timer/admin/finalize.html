<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finalize Race · Admin · 2026 Riley Swanson Bday Time Trial</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b3d91">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0d1420;--muted:#5a6575;--line:#d5dbe4;--pri:#0b3d91;--soft:#e8eef8;--brk:#fff4dc;--brk-ink:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#161d28;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--pri:#8fb3ff;--soft:#1f2a3c;--brk:#2e2614;--brk-ink:#f0c46a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b3d91;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav a{color:#cfdcf5;text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px 10px 0 0;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--pri)}
header h1{margin:0;font-size:24px}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:13px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:#0b3d91;color:#fff;border-color:#0b3d91;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status .grow{flex:1}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:#fff4dc;color:#8a5a00}
.pill.ok{background:#dcf3e5;color:#0a7a3d}
@media (prefers-color-scheme:dark){.pill{background:#2e2614;color:#f0c46a}.pill.ok{background:#153222;color:#4cc985}}
.big{min-height:48px;font-size:16px;padding:10px 20px}
.danger{color:#b3261e;border-color:#e6b4b0}
td.rank{font-weight:800}
td.t{font-variant-numeric:tabular-nums;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>2026 Riley Swanson Bday Time Trial · Admin</h1>
  <nav><a href="./">Start List Creator</a><a href="timing.html">Race Timing</a><a class="on" href="finalize.html">Finalize Race</a></nav>
</header>
<main>
  <div class="card">
    <div class="status">
      <span class="pill" id="pubPill">Checking…</span>
      <span class="grow"></span>
      <button id="refresh">Refresh</button>
      <button class="danger" id="unpubBtn" hidden>Unpublish</button>
      <button class="pri big" id="pubBtn" disabled>Publish results</button>
    </div>
    <p class="muted" id="msg" style="margin:8px 0 0"></p>
  </div>
  <div class="card">
    <h2 style="margin-bottom:6px">Race results in the Sheet</h2>
    <div class="wrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script>
"use strict";
const SHEET = '1PqselA1x1xcKgkLQq2a1JQm8nFdDSZ_i21E_3XVotaA';
const WEB_APP = 'https://script.google.com/macros/s/AKfycbz0TD1XClbOVJHJrqoy9Ee8OCRmnVakOLIb4sq3ddvQK-bLrRpPon-XgV5WuZCR7yg1aQ/exec';
const csvUrl = tab => `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}`;
const $ = s => document.querySelector(s);
function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
// a results-style tab as { head, rows }; rows is [] if the tab is missing, empty or not a results tab
async function getTab(tab) {
  const res = await fetch(csvUrl(tab), { cache: 'no-store' });
  const text = await res.text();
  if (!res.ok || /^\s*</.test(text)) throw new Error('Sheet unavailable');
  const rows = parseCSV(text);
  if (!rows.length || rows[0][0] !== 'Rank') return { head: [], rows: [] };
  return { head: rows[0], rows: rows.slice(1) };
}
const NUM = new Set(['Rank', '#', 'Birth year', 'Lap 1', 'Lap 2', 'Total']);
function td(text, cls) { const e = document.createElement('td'); e.textContent = text; if (cls) e.className = cls; return e; }
let results = [];
async function load() {
  $('#msg').textContent = '';
  try {
    const [R, F] = await Promise.all([getTab('Results'), getTab('Final results')]);
    const r = R.rows, f = F.rows; results = r;
    const head = $('#head'); head.textContent = '';
    for (const c of R.head) { const th = document.createElement('th'); th.textContent = c; if (NUM.has(c)) th.className = 'n'; head.append(th); }
    const tb = $('#rows'); tb.textContent = '';
    for (const x of r) {
      const tr = document.createElement('tr');
      R.head.forEach((c, i) => tr.append(td(x[i] || '', c === 'Rank' ? 'n rank' : /^(Lap|Total)/.test(c) ? 'n t' : NUM.has(c) ? 'n' : '')));
      tb.append(tr);
    }
    if (!r.length) tb.innerHTML = '<tr><td colspan="8" class="muted">No results yet. End the race on the Race Timing tab first.</td></tr>';
    const same = f.length && JSON.stringify(F) === JSON.stringify(R);
    const pill = $('#pubPill');
    if (!f.length) { pill.className = 'pill'; pill.textContent = 'Not published: public Results says Coming soon'; }
    else if (same) { pill.className = 'pill ok'; pill.textContent = 'Published ✓ public Results is up to date'; }
    else { pill.className = 'pill'; pill.textContent = 'Published, but the results have changed since. Publish again to update.'; }
    $('#pubBtn').disabled = !r.length || same;
    $('#pubBtn').textContent = f.length ? 'Publish again' : 'Publish results';
    $('#unpubBtn').hidden = !f.length;
  } catch (e) {
    $('#pubPill').className = 'pill'; $('#pubPill').textContent = 'Couldn\u2019t reach the Sheet';
    $('#msg').textContent = 'Check your connection and tap Refresh.';
  }
}
async function post(body, busyText) {
  const btns = [$('#pubBtn'), $('#unpubBtn'), $('#refresh')]; btns.forEach(b => b.disabled = true);
  $('#msg').textContent = busyText;
  try {
    const res = await fetch(WEB_APP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'not saved');
    $('#msg').textContent = '';
  } catch (e) { $('#msg').textContent = 'Failed: ' + e.message + '. Try again.'; }
  btns.forEach(b => b.disabled = false);
  await load();
}
$('#pubBtn').onclick = () => post({ type: 'finalize' }, 'Publishing…');
let unArmed = false, unTimer;
$('#unpubBtn').onclick = () => {
  if (!unArmed) { unArmed = true; $('#unpubBtn').textContent = 'Tap again to unpublish'; unTimer = setTimeout(() => { unArmed = false; $('#unpubBtn').textContent = 'Unpublish'; }, 3000); return; }
  clearTimeout(unTimer); unArmed = false; $('#unpubBtn').textContent = 'Unpublish';
  post({ type: 'unfinalize' }, 'Unpublishing…');
};
$('#refresh').onclick = load;
load();
</script>
</body>
</html>
