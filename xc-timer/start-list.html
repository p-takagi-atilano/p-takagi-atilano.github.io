<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Start List · 2026 Silver Star PNW Time Trial</title>
<meta name="theme-color" content="#0b3d91">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0d1420;--muted:#5a6575;--line:#d5dbe4;--pri:#0b3d91;--soft:#e8eef8}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#161d28;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--pri:#8fb3ff;--soft:#1f2a3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b3d91;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
header h1{margin:0;font-size:24px}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav a{color:#cfdcf5;text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px 10px 0 0;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--pri)}
main{max-width:640px;margin:0 auto;padding:16px}
.reg{display:block;text-align:center;background:#d62828;color:#fff;text-decoration:none;font-weight:800;font-size:20px;padding:16px;border-radius:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.num{display:inline-block;min-width:1.8em;color:var(--muted)}
.soon{text-align:center;padding:48px 16px}
.soon h2{font-size:22px;margin:0 0 6px}
</style>
</head>
<body>
<header>
  <h1>2026 Silver Star PNW Time Trial</h1>
  <nav><a href="./">Registration</a><a class="on" href="start-list.html">Start list</a></nav>
</header>
<main>
  <div class="card soon">
    <h2>Coming soon</h2>
    <p class="muted">The start list will be posted here before the race.</p>
  </div>
</main>
</body>
</html>
