<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 Riley Swanson Bday Time Trial</title>
<meta name="theme-color" content="#0b3d91">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0d1420;--muted:#5a6575;--line:#d5dbe4;--pri:#0b3d91;--soft:#e8eef8}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#161d28;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--pri:#8fb3ff;--soft:#1f2a3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b3d91;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
header h1{margin:0;font-size:24px}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav a{color:#cfdcf5;text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px 10px 0 0;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--pri)}
main{max-width:640px;margin:0 auto;padding:16px}
.reg{display:block;text-align:center;background:#d62828;color:#fff;text-decoration:none;font-weight:800;font-size:20px;padding:16px;border-radius:14px;margin:16px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.num{display:inline-block;min-width:1.8em;color:var(--muted)}
button.reg{width:100%;border:0;cursor:pointer;font-family:inherit}
#regForm{margin-top:16px;display:grid;gap:10px}
#regForm label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
#regForm input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#regForm .btns{display:flex;gap:10px}
#regForm .btns button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
#regForm .btns button[type=submit]{background:#d62828;border-color:#d62828;color:#fff}
#regMsg{margin:10px 0 0;text-align:center;font-weight:600}
#regMsg.err{color:#d62828}
</style>
</head>
<body>
<header>
  <h1>2026 Riley Swanson Bday Time Trial</h1>
  <nav><a class="on" href="./">Registration</a><a href="start-list.html">Start list</a><a href="results.html">Results</a></nav>
</header>
<main>
  <div class="card">
    <div class="top"><h2>Registered (<span id="count">…</span>)</h2></div>
    <table>
      <thead><tr><th>Name</th><th class="n">Born</th><th>Team</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
  <button class="reg" id="regBtn">Register</button>
  <form class="card" id="regForm" hidden autocomplete="off">
    <h2>Register</h2>
    <label>Name<input id="rName" required maxlength="80" placeholder="First and last name"></label>
    <label>Birth year<input id="rBirth" required inputmode="numeric" pattern="(19|20)[0-9]{2}" maxlength="4" placeholder="e.g. 2012"></label>
    <label>Team<input id="rTeam" maxlength="80" placeholder="Optional"></label>
    <div class="btns"><button type="button" id="rCancel">Cancel</button><button type="submit" id="rSubmit">Register</button></div>
  </form>
  <p class="muted" id="regMsg" hidden></p>
</main>
<script>
"use strict";
const SHEET = '1PqselA1x1xcKgkLQq2a1JQm8nFdDSZ_i21E_3XVotaA';
const URL_CSV = `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent('Registrations')}`;
const WEB_APP = 'https://script.google.com/macros/s/AKfycbz0TD1XClbOVJHJrqoy9Ee8OCRmnVakOLIb4sq3ddvQK-bLrRpPon-XgV5WuZCR7yg1aQ/exec';
const $ = s => document.querySelector(s);

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function cell(text, cls) { const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; return td; }

async function load() {
  try {
    const res = await fetch(URL_CSV, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('sheet not shared');
    const rows = parseCSV(text);
    const h = (rows.shift() || []).map(x => x.trim().toLowerCase());
    const iN = h.indexOf('name'), iBs = h.map((x, i) => x.includes('birth') ? i : -1).filter(i => i >= 0), iTm = h.indexOf('team');
    // one entry per name; a later submission replaces an earlier one
    const byName = new Map();
    for (const r of rows) { const n = (r[iN] || '').trim(); if (n) byName.set(n.toLowerCase(), r); }
    const list = [...byName.values()];
    const tb = $('#rows'); tb.textContent = '';
    list.forEach((r, i) => {
      const tr = document.createElement('tr');
      const name = cell(''); const num = document.createElement('span'); num.className = 'num'; num.textContent = (i + 1) + '.';
      name.append(num, ' ' + r[iN].trim());
      tr.append(name, cell(iBs.map(i => (r[i] || '').trim()).find(Boolean) || '', 'n'), cell(iTm >= 0 ? (r[iTm] || '').trim() : ''));
      tb.append(tr);
    });
    if (!list.length) tb.innerHTML = '<tr><td colspan="3" class="muted">Nobody yet. Be the first!</td></tr>';
    $('#count').textContent = list.length;
  } catch (e) {
    $('#count').textContent = '?';
    $('#rows').innerHTML = '<tr><td colspan="3" class="muted">Couldn’t load the list right now.</td></tr>';
  }
}
load(); setInterval(load, 30000);

// Register: adds a row to the Sheet's "Registrations" tab through the Apps Script web app
const msg = (text, err) => { const m = $('#regMsg'); m.hidden = !text; m.textContent = text || ''; m.className = 'muted' + (err ? ' err' : ''); };
$('#regBtn').onclick = () => { $('#regForm').hidden = false; $('#regBtn').hidden = true; msg(''); $('#rName').focus(); };
$('#rCancel').onclick = () => { $('#regForm').hidden = true; $('#regBtn').hidden = false; };
$('#regForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('#rName').value.trim(), birth = $('#rBirth').value.trim(), team = $('#rTeam').value.trim();
  if (!name || !/^(19|20)\d{2}$/.test(birth)) { msg('Please enter your name and a 4-digit birth year.', true); return; }
  $('#rSubmit').disabled = true; $('#rSubmit').textContent = 'Registering…'; msg('');
  try {
    const res = await fetch(WEB_APP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'register', name, birth, team }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'not saved');
    $('#regForm').reset(); $('#regForm').hidden = true; $('#regBtn').hidden = false;
    msg(`${name} is registered ✓`);
    load();
  } catch (err) {
    msg('Couldn’t register right now. Check your signal and try again.', true);
  }
  $('#rSubmit').disabled = false; $('#rSubmit').textContent = 'Register';
};
</script>
</body>
</html>
