<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Results · 2026 Riley Swanson Birthday Time Trial</title>
<meta name="theme-color" content="#0b3d91">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0d1420;--muted:#5a6575;--line:#d5dbe4;--pri:#0b3d91;--soft:#e8eef8}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#161d28;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--pri:#8fb3ff;--soft:#1f2a3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b3d91;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
header h1{margin:0;font-size:24px}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav a{color:#cfdcf5;text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px 10px 0 0;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--pri)}
main{max-width:640px;margin:0 auto;padding:16px}
.reg{display:block;text-align:center;background:#d62828;color:#fff;text-decoration:none;font-weight:800;font-size:20px;padding:16px;border-radius:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.num{display:inline-block;min-width:1.8em;color:var(--muted)}
.soon{text-align:center;padding:48px 16px}
.soon h2{font-size:22px;margin:0 0 6px}
[hidden]{display:none!important}
td.rank{font-weight:800}
td.t{font-variant-numeric:tabular-nums;font-weight:600}
.wrap{overflow-x:auto;margin:0 -6px}
#pdfBtn{font:inherit;font-size:14px;font-weight:600;color:#fff;background:#0b3d91;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
#pdfBtn:disabled{opacity:.6}
.loading{display:flex;justify-content:center;padding:48px 16px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
td.start{font-variant-numeric:tabular-nums;font-weight:600}
tr.brk td{background:#fff4dc;color:#8a5a00;font-weight:600;text-align:center}
@media (prefers-color-scheme:dark){tr.brk td{background:#2e2614;color:#f0c46a}}
.sbtn{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer}
.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--pri);border-radius:99px;padding:3px 6px 3px 10px;font-weight:600}
.chip button{font:inherit;border:0;background:transparent;color:inherit;padding:0 4px;cursor:pointer}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th.act{color:var(--pri)}
td .pl{color:var(--muted);font-weight:500;font-size:13px}
td.dnf{color:var(--muted);font-weight:600}
th,td{white-space:nowrap}
main{max-width:920px}
.fgroup{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.flabel{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.pill.on{color:#0e131b}}
#q{font:inherit;font-size:16px;width:100%;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.sub{display:none;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px;white-space:normal}
/* phones: Rank | Skier (bib · team · born underneath) | Time (laps underneath) so nothing scrolls sideways */
@media (max-width:700px){
  .w{display:none}
  .sub{display:block}
  td.nm{white-space:normal;width:100%}
  .sub.lp{white-space:nowrap;margin-top:1px}
  .wrap{overflow-x:visible}
}
</style>
</head>
<body>
<header>
  <h1>2026 Riley Swanson Birthday Time Trial</h1>
  <nav><a href="./">Registration</a><a href="start-list.html">Start list</a><a class="on" href="results.html">Results</a></nav>
</header>
<main>
  <div class="card loading" id="loading"><span class="spin"></span></div>
  <div class="card soon" id="soon" hidden>
    <h2>Coming soon</h2>
    <p class="muted">Results will be posted here after the race.</p>
  </div>
  <div class="card" id="list" hidden>
    <div class="fgroup"><input id="q" type="search" placeholder="Search by name" autocomplete="off" enterkeyhint="search"></div>
    <div class="fgroup"><span class="flabel">Team</span><div class="pills" id="fTeam"></div></div>
    <div class="fgroup"><span class="flabel">Birth year</span><div class="pills" id="fBirth"></div></div>
    <div class="fgroup"><span class="flabel">Gender</span><div class="pills" id="fGender"></div></div>
    <div class="fgroup"><div><button class="sbtn" id="clearF" hidden>Clear filters</button></div></div>
    <div class="sortbar" id="sortbar"></div>
    <div class="wrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
"use strict";
const SHEET = '1PqselA1x1xcKgkLQq2a1JQm8nFdDSZ_i21E_3XVotaA';
const URL_CSV = `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent('Final results')}`;
const $ = s => document.querySelector(s);
function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
// "9:41.3" / "1:02:03.4" -> ms; anything else (DNF, blank) -> null
function toMs(s) {
  const m = String(s || '').trim().match(/^(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)$/);
  return m ? ((+(m[1] || 0) * 60 + +m[2]) * 60 + +m[3]) * 1000 : null;
}

let athletes = []; // {bib, name, team, birth, gender, l1, l2, total, l1s, l2s, totals}
const filters = { team: new Set(), birth: new Set(), gender: new Set() }; // empty set = everyone
let query = '';
let sort = []; // [{key, dir}] chain; empty = by rank
const SORTABLE = { team: { label: 'Team', type: 'text' }, birth: { label: 'Birth year', type: 'num' }, gender: { label: 'Gender', type: 'text' } };

async function load() {
  let rows = [], head = [];
  try {
    const res = await fetch(URL_CSV, { cache: 'no-store' });
    const text = await res.text();
    if (res.ok && !/^\s*</.test(text)) { const all = parseCSV(text); if (all.length && all[0][0] === 'Rank') { head = all[0]; rows = all.slice(1); } }
  } catch {}
  const col = name => head.indexOf(name);
  const get = (r, name) => { const i = col(name); return i >= 0 ? (r[i] || '').trim() : ''; };
  athletes = rows.map(r => ({
    bib: get(r, '#'), name: get(r, 'Name'), team: get(r, 'Team'), birth: get(r, 'Birth year'), gender: get(r, 'Gender'),
    l1s: get(r, 'Lap 1'), l2s: get(r, 'Lap 2'), totals: get(r, 'Total'),
    l1: toMs(get(r, 'Lap 1')), l2: toMs(get(r, 'Lap 2')), total: toMs(get(r, 'Total')),
  }));
  $('#loading').hidden = true;
  $('#soon').hidden = athletes.length > 0;
  $('#list').hidden = athletes.length === 0;
  if (athletes.length) { fillFilters(); render(); }
}

function fillFilters() {
  const pills = (key, box, numeric) => {
    const vals = [...new Set(athletes.map(a => a[key]).filter(Boolean))].sort((x, y) => numeric ? x - y : x.localeCompare(y));
    for (const v of [...filters[key]]) if (!vals.includes(v)) filters[key].delete(v);
    box.textContent = '';
    for (const v of vals) {
      const b = el('button', { className: 'pill' + (filters[key].has(v) ? ' on' : ''), textContent: v });
      b.setAttribute('aria-pressed', filters[key].has(v));
      b.onclick = () => { filters[key].has(v) ? filters[key].delete(v) : filters[key].add(v); fillFilters(); render(); };
      box.append(b);
    }
  };
  pills('team', $('#fTeam')); pills('birth', $('#fBirth'), true); pills('gender', $('#fGender'));
}
$('#q').oninput = e => { query = e.target.value; render(); };
$('#clearF').onclick = () => { filters.team.clear(); filters.birth.clear(); filters.gender.clear(); query = ''; $('#q').value = ''; fillFilters(); render(); };

// place of each value among the shown athletes (ties share a place); null for no time
function places(list, key) {
  const times = list.map(a => a[key]).filter(t => t != null).sort((x, y) => x - y);
  const m = new Map(); list.forEach(a => { if (a[key] != null) m.set(a, times.indexOf(a[key]) + 1); });
  return m;
}
function clickSort(key) {
  const i = sort.findIndex(s => s.key === key);
  if (i < 0) sort.push({ key, dir: 1 }); else if (sort[i].dir === 1) sort[i].dir = -1; else sort.splice(i, 1);
  render();
}
function cmpKey(a, b, key, dir) {
  const x = a[key], y = b[key], ex = !x, ey = !y;
  if (ex || ey) return ex === ey ? 0 : ex ? 1 : -1; // blanks last
  return dir * (SORTABLE[key].type === 'num' ? x - y : x.localeCompare(y, undefined, { sensitivity: 'base' }));
}
function el(tag, props = {}, ...kids) { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; }

function render() {
  const inSet = (set, v) => !set.size || set.has(v);
  const field = athletes.filter(a => inSet(filters.team, a.team) && inSet(filters.birth, a.birth) && inSet(filters.gender, a.gender));
  // places are among the team/birth-year/gender selection; the name search only hides rows
  const rank = places(field, 'total'), p1 = places(field, 'l1'), p2 = places(field, 'l2');
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const q = norm(query.trim());
  const shown = q ? field.filter(a => norm(a.name).includes(q)) : field;
  $('#clearF').hidden = !(filters.team.size || filters.birth.size || filters.gender.size || q);
  const byRank = (a, b) => (a.total == null) - (b.total == null) || (a.total ?? 0) - (b.total ?? 0) || (+a.bib || 0) - (+b.bib || 0);
  shown.sort((a, b) => { for (const s of sort) { const c = cmpKey(a, b, s.key, s.dir); if (c) return c; } return byRank(a, b); });

  // sort chips
  const bar = $('#sortbar'); bar.textContent = '';
  bar.append(el('span', { className: 'muted', textContent: 'Sort:' }));
  if (!sort.length) bar.append(el('span', { className: 'muted', textContent: 'rank' }));
  sort.forEach((s, i) => {
    if (i) bar.append(el('span', { className: 'muted', textContent: 'then' }));
    const c = SORTABLE[s.key];
    const flip = el('button', { textContent: c.label + (s.dir === 1 ? (c.type === 'num' ? ' ↑ low→high' : ' ↑ A→Z') : (c.type === 'num' ? ' ↓ high→low' : ' ↓ Z→A')) });
    flip.onclick = () => { s.dir *= -1; render(); };
    const x = el('button', { textContent: '×', title: 'Remove' }); x.onclick = () => { sort.splice(i, 1); render(); };
    bar.append(el('span', { className: 'chip' }, flip, x));
  });
  for (const k of Object.keys(SORTABLE)) if (!sort.some(s => s.key === k)) {
    const add = el('button', { className: 'sbtn', textContent: '+ ' + SORTABLE[k].label }); add.onclick = () => clickSort(k); bar.append(add);
  }
  if (sort.length) { const clr = el('button', { className: 'sbtn', textContent: 'Clear sort' }); clr.onclick = () => { sort = []; render(); }; bar.append(clr); }

  // header
  const head = $('#head'); head.textContent = '';
  const cols = [['Rank', 'n'], ['#', 'n w'], ['Name', ''], ['team', 'w'], ['birth', 'n w'], ['gender', 'w'], ['Lap 1', 'n w'], ['Lap 2', 'n w'], ['Total', 'n']];
  for (const [k, cls = ''] of cols) {
    if (SORTABLE[k]) {
      const i = sort.findIndex(s => s.key === k);
      const th = el('th', { className: ('s ' + cls + (i >= 0 ? ' act' : '')).trim() }, SORTABLE[k].label + (i >= 0 ? ' ' + (sort.length > 1 ? i + 1 : '') + (sort[i].dir === 1 ? '↑' : '↓') : ''));
      th.onclick = () => clickSort(k); head.append(th);
    } else head.append(el('th', { className: cls, textContent: k }));
  }
  // rows
  const tb = $('#rows'); tb.textContent = '';
  const timeCell = (str, place) => { const c = el('td', { className: 'n t' }, str); if (place) c.append(' ', el('span', { className: 'pl', textContent: '(' + place + ')' })); return c; };
  for (const a of shown) {
    const lap = (s, p) => s ? s + (p ? ' (' + p + ')' : '') : '–';
    const who = ['#' + a.bib, a.team, a.birth, a.gender].filter(x => x && x !== '#').join(' · ');
    const tot = el('td', { className: a.total != null ? 'n t' : 'n dnf', textContent: a.totals });
    tot.append(el('div', { className: 'sub lp', textContent: 'L1 ' + lap(a.l1s, p1.get(a)) }), el('div', { className: 'sub lp', textContent: 'L2 ' + lap(a.l2s, p2.get(a)) }));
    const l1 = timeCell(a.l1s, p1.get(a)), l2 = timeCell(a.l2s, p2.get(a)); l1.classList.add('w'); l2.classList.add('w');
    tb.append(el('tr', {},
      el('td', { className: 'n rank', textContent: rank.get(a) || '' }),
      el('td', { className: 'n w', textContent: a.bib }),
      el('td', { className: 'nm' }, a.name, el('div', { className: 'sub', textContent: who })),
      el('td', { className: 'w', textContent: a.team }),
      el('td', { className: 'n w', textContent: a.birth }),
      el('td', { className: 'w', textContent: a.gender }),
      l1, l2, tot));
  }
  if (!shown.length) tb.append(el('tr', {}, el('td', { colSpan: 9, className: 'muted', textContent: 'Nobody matches.' })));
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
