<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race Results</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#0d1420;--muted:#5a6575;--line:#d5dbe4;--pri:#0b3d91;--ok:#0a7a3d;--soft:#e8eef8}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#161d28;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--pri:#8fb3ff;--ok:#4cc985;--soft:#1f2a3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:#0b3d91;color:#fff;padding:18px 16px}
header h1{margin:0;font-size:22px} header p{margin:4px 0 0;opacity:.8;font-size:13px}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 12px}
.seg button{border:0;background:var(--card);color:var(--ink);padding:9px 16px;font:inherit;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
h2{font-size:16px;margin:4px 0 6px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bib{display:inline-block;min-width:2em;text-align:center;font-weight:800;background:var(--soft);color:var(--pri);border-radius:6px;padding:0 4px;margin-right:4px}
.best{color:var(--ok);font-weight:800}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header><h1 id="title">Results</h1><p id="sub">Loading…</p></header>
<main>
  <div class="seg" id="mode"><button data-m="overall" class="on">Overall</button><button data-m="group">By group</button></div>
  <div id="out"></div>
</main>
<script>
"use strict";
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src = new URLSearchParams(location.search).get('src');
let data = null, mode = 'overall';
document.getElementById('mode').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
async function load() {
  if (!src || !/^https:\/\/script\.google(usercontent)?\.com\//.test(src)) { document.getElementById('sub').textContent = 'No results source in this link. Open it from the timing app’s “Public results link”.'; return; }
  try {
    const r = await fetch(src + (src.includes('?') ? '&' : '?') + 'type=results', { cache: 'no-store' });
    data = await r.json(); draw();
  } catch (e) { document.getElementById('sub').textContent = 'Could not load results (' + e.message + ').'; }
}
function draw() {
  if (!data) return;
  document.getElementById('title').textContent = data.raceName || 'Results';
  document.title = (data.raceName || 'Race') + ' results';
  document.getElementById('sub').textContent = [data.date, data.updated ? 'updated ' + new Date(data.updated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''].filter(Boolean).join(' · ') || 'No results yet';
  const H = data.header, col = n => H.indexOf(n);
  if (!H.length) { document.getElementById('out').innerHTML = '<p class="muted">No results posted yet.</p>'; return; }
  const lapCols = H.map((h, i) => /^Lap \d+$/.test(h) ? i : -1).filter(i => i >= 0);
  const toMs = s => { if (!s) return Infinity; const p = s.split(':').map(Number); return p.reduce((a, b) => a * 60 + b, 0) * 1000; };
  const best = lapCols.map(i => Math.min(...data.rows.map(r => toMs(r[i]))));
  const iR = col('Rank'), iB = col('Bib'), iN = col('Name'), iG = col('Group'), iGR = col('Group rank'), iT = col('Total'), iBh = col('Behind'), iS = col('Status');
  const table = (rows, grp) => `<div class="wrap"><table><thead><tr><th class="n">#</th><th>Racer</th>${grp ? '' : '<th>Group</th>'}${lapCols.map(i => `<th class="n">${esc(H[i])}</th>`).join('')}<th class="n">Total</th><th class="n">Behind</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="n"><b>${esc(grp ? r[iGR] : r[iR])}</b></td><td><span class="bib">${esc(r[iB])}</span>${esc(r[iN])}</td>${grp ? '' : `<td>${esc(r[iG])}</td>`}
      ${lapCols.map((i, k) => `<td class="n ${toMs(r[i]) === best[k] ? 'best' : ''}">${esc(r[i])}</td>`).join('')}
      <td class="n"><b>${esc(r[iT] || r[iS])}</b></td><td class="n">${grp ? '' : esc(r[iBh])}</td></tr>`).join('') + '</tbody></table></div>';
  let html;
  if (mode === 'overall') html = `<div class="card">${table(data.rows, false)}</div>`;
  else {
    const groups = []; const by = {};
    for (const r of data.rows) if (r[iGR]) { if (!by[r[iG]]) { by[r[iG]] = []; groups.push(r[iG]); } by[r[iG]].push(r); }
    groups.forEach(g => by[g].sort((a, b) => +a[iGR] - +b[iGR]));
    html = groups.map(g => `<div class="card"><h2>${esc(g)}</h2>${table(by[g], true)}</div>`).join('') || '<p class="muted">No finishers yet.</p>';
  }
  document.getElementById('out').innerHTML = html;
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
