<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assistant">
<meta name="theme-color" content="#2f6f4f">
<title>Assistant</title>
<style>
  :root{--bg:#f6f5f2;--ink:#1d1d1b;--muted:#6b6a66;--accent:#2f6f4f;--accent-ink:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#151514;--ink:#ecebe7;--muted:#9a9993;--accent:#5fae86;--accent-ink:#0d1a13}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
       font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  main{width:100%;max-width:420px;text-align:center}
  a.go{display:block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:18px;
       padding:16px;border-radius:14px;margin:16px 0}
  p{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
  <p>Opening…</p>
  <a class="go" href="https://script.google.com/macros/s/AKfycbw2wUHZvITPeFhI0v3OEhqElw-RhgUgnrgCW9MDNvsOmkaVa52d7RMQPgLeyYmOYq-amw/exec">Open</a>
  <p>Private. Requires sign-in.</p>
</main>
<script>
  // Redirect immediately. Add ?stay to this URL to stay on this page (e.g. to Add to Home Screen).
  if (!/[?&]stay\b/.test(location.search)) location.replace(document.querySelector('a.go').href);
</script>
</body>
</html>
